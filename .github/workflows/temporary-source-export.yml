name: temporary-source-export
on:
  push:
    paths-ignore:
      - '.github/workflows/temporary-source-export.yml'
      - '.source-artifact-id'
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/entry-agents-source.tar.gz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: entry-agents-source
          path: /tmp/entry-agents-source.tar.gz
          retention-days: 1
      - name: Record artifact id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 2
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=entry-agents-source&per_page=10" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last.id')
          echo "$ID" > .source-artifact-id
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .source-artifact-id
          git commit -m 'chore: record temporary source artifact id' || true
          git push
